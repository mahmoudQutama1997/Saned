{% extends 'base.html' %}
{% block title %}طلب مساعدة{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Reservation</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-lg p-4 rounded">
        <h2 class="mb-3 text-primary">لقد وصلت الى صفحة التبرع التابعة للحملة التي ساهمت فيها , {{ user.name }}</h2>

        <p><strong>عنوان الحملة:</strong> {{ campaign.title }}</p>
        <p><strong>مبلغ الحملة ككل </strong> NIS{{ campaign.goal_amount }}</p>

        <form method="POST" action="{% url 'payment_success' campaign.id %}">
            {% csrf_token %}
            

            <div class="mb-3">
                <label for="amount" class="form-label">المبلغ المراد دفعه:</label>
                <input type="number" id="amount" name="amount" class="form-control">
            </div>

           

            <div class="mb-3">
                <label class="form-label">طريقة الدفع</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="payment" id="creditCard" value="CreditCard">
                    <label class="form-check-label" for="creditCard">Credit Card</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="payment" id="paypal" value="PayPal">
                    <label class="form-check-label" for="paypal">PayPal</label>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100">التأكيد على التبرع بكامل المبلغ</button>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/boo
{% endblock %}
